services:
  poseidon:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-optional-bootstrap
    image: poseidon:local
    container_name: poseidon
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./db:/app/db
      - ./logs:/app/backend/data/logs
      - ./models:/app/backend/data/models
      - ./memray:/app/backend/data/memray
      - ./screenshots:/app/data/screenshots
      - ./optional-dependencies:/app/backend/data/optional-dependencies
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
