<nav class="flex justify-between items-center mx-auto px-3 py-3 md:px-6 md:py-6">
    <div class="relative inline-block shrink-0">
        <img src="assets/poseidon.png" alt="Poseidon" class="h-14 w-auto md:h-20" />
        <app-connection-overlay-pill></app-connection-overlay-pill>
    </div>
    <div class="flex-none">
        <div class="flex items-center gap-1 rounded-full bg-white/5 border border-white/10 backdrop-blur shadow-sm px-1 py-1 text-sm" role="navigation" aria-label="Main">
            @for (item of items; track item.route) {
                <a [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.exact }" class="nav-item inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-white hover:text-slate-200/80 hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/60 transition-colors" [attr.aria-label]="getAriaLabel(item)">
                    <span class="inline-flex">
                        <i [class]="'fa fa-' + item.icon"></i>
                    </span>
                    <span class="font-medium">{{ item.label }}</span>
                </a>
            }
        </div>
    </div>
</nav>
